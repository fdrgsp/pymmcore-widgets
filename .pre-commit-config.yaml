ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: "style(pre-commit.ci): auto fixes [...]"
  autoupdate_commit_msg: "ci(pre-commit.ci): autoupdate"

repos:
  - repo: https://github.com/crate-ci/typos
    rev: v1.40.0
    hooks:
      - id: typos
        args: [--force-exclude] # omitting --write-changes

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        files: "^src/"
        additional_dependencies:
          # matches this project's own pin (see [tool.uv.sources]): the MDA
          # widgets' output annotations use pymmcore_plus.mda.SingleOutput,
          # which the released package does not export yet. NOTE: pre-commit
          # caches this env by the dependency string, so run `pre-commit clean`
          # after pushing a pymmcore-plus change this hook needs to see.
          - pymmcore-plus @ git+https://github.com/fdrgsp/pymmcore-plus@cite
          - useq-schema >=0.8.0
